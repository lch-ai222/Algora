name: CI

# Three independent gates, deliberately not merged into one job:
#   quality       — lint, unit tests, per-case benchmark selfcheck
#   sandbox-image — the container isolation layer actually builds AND runs, offline
#   console       — the React console still typechecks and builds
# No job needs an LLM key: everything here is deterministic, so CI stays free and green
# regardless of provider availability.

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · tests · benchmark selfcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,api]"

      - name: Ruff
        run: ruff check src tests scripts backend

      - name: Tests
        run: pytest -q

      # Per-case hard gate: target fails on base, defect isolated, reference fix passes
      # target+regression+hidden, hidden tests unreadable from the workspace.
      - name: Benchmark selfcheck (short + long)
        run: |
          python scripts/selfcheck.py datasets/mini_store_suite
          python scripts/selfcheck.py datasets/mini_store_long

  sandbox-image:
    name: Sandbox image builds and runs offline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Loaded into the local daemon rather than pushed: the point is to prove the image is
      # usable, and an image that builds but cannot run a trial is not a working isolation layer.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sandbox.Dockerfile
          tags: codeagent-eval-sandbox:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: CLI is reachable inside the image
        run: docker run --rm --network none codeagent-eval-sandbox:ci

      # --network none is the claim the MVP worktree sandbox cannot make: the command
      # allow-list blocks known network tools, while this cuts the network at the kernel.
      # Running the full pipeline offline is what turns that from a design note into evidence.
      - name: Benchmark selfcheck inside the container, network cut
        run: |
          docker run --rm --network none codeagent-eval-sandbox:ci \
            python scripts/selfcheck.py datasets/mini_store_suite
          docker run --rm --network none codeagent-eval-sandbox:ci \
            python scripts/selfcheck.py datasets/mini_store_long

      - name: Deterministic bounds inside the container, network cut
        run: |
          docker run --rm --network none --cpus 2 --memory 2g codeagent-eval-sandbox:ci \
            python scripts/check_bounds.py \
              --suite datasets/mini_store_suite \
              --suite datasets/mini_store_long

  console:
    name: Console typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # `npm run build` is `tsc && vite build`: a type error fails the job.
      - name: Typecheck and build
        run: npm run build
