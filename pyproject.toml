[project]
name = "codeagent-eval"
version = "0.1.0"
description = "CodeAgent Eval Lab — repo-level coding agent with a deterministic evaluation pipeline (trajectory capture, graded scoring, failure attribution, V1/V2 regression)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.4",
    "python-dotenv>=1.0.1",
    "openai>=1.58.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.4",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=2.0.0",
]
evalplus = [
    "evalplus==0.3.1",
]

[project.scripts]
codeagent-eval = "codeagent_eval.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/codeagent_eval"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/app/routers/*.py" = ["B008"]
"backend/app/deps.py" = ["B008"]
