[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-store-long"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mini-store = "mini_store.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mini_store*"]

[tool.setuptools.dynamic]
version = {attr = "mini_store.version.VERSION"}
